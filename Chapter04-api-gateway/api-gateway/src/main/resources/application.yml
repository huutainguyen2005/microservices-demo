spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # CATALOG -> INVOICE
            - id: catalog-invoice-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/catalog/invoices
              filters:
                - RewritePath=/api/v1/catalog/invoices, /api/v1/invoices

            # CATALOG SERVICE
            - id: catalog-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/catalog/**
              filters:
                - RewritePath=/api/v1/catalog/(?<segment>.*), /api/v1/$\{segment}

            # CUSTOMER SERVICE
            - id: customer-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/customer/**
              filters:
                - RewritePath=/api/v1/customer/(?<segment>.*), /api/v1/$\{segment}

            # INVOICE SERVICE
            - id: invoice-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/invoice/**
              filters:
                - RewritePath=/api/v1/invoice/(?<segment>.*), /api/v1/$\{segment}

# Rewrite
# http://localhost:8080/api/v1/catalog/artists
# ->  http://localhost:8081/api/v1/artist

# http://localhost:8080/api/v1/customer/customers
# -> http://localhost:8082/api/v1/customers

# http://localhost:8080/api/v1/invoice/invoices
# -> http://localhost:8083/api/v1/invoices

# http://localhost:8080/api/v1/catalog/invoices
# -> http://localhost:8083/api/v1/invoices

#  https://dvc.org/api/danhmuc
#  https://dvc.org/api/congdan

server:
  port: 8080